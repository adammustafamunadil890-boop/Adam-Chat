name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP File
        run: |
          unzip -o *.zip || true
          echo "Extracted files successfully"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Inject Configuration and Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          cd $PROJECT_DIR

          # Clean and rebuild native Android platform
          rm -rf android
          flutter create . --platforms=android --org com.example

          # Add dependencies
          flutter pub add flutter_local_notifications:18.0.1
          flutter pub get

          # Inject google-services.json
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "599339043109",
              "project_id": "adam-chat-21b40",
              "storage_bucket": "adam-chat-21b40.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:599339043109:android:13fe2e65bc7bfed37372cc",
                  "android_client_info": {
                    "package_name": "com.example.adam_chat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUTfSCfP1LTSOMVj_2684Xpg_H__p_2jo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # Add network permissions
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' $MANIFEST_FILE

          # Overwrite build.gradle (Disable Minify & Keep Desugaring)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.adam_chat"
              compileSdk 35

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.example.adam_chat"
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF

          # Build APK without shrinking
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
