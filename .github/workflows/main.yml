name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP File
        run: |
          unzip -o *.zip || true
          echo "Extracted files successfully"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Inject Configuration and Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          cd $PROJECT_DIR

          # Clean and rebuild android platform
          rm -rf android
          flutter create . --platforms=android --org com.example

          # Add matching packages
          flutter pub add flutter_local_notifications:18.0.1
          flutter pub get

          # Inject google-services.json
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "599339043109",
              "project_id": "adam-chat-21b40",
              "storage_bucket": "adam-chat-21b40.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:599339043109:android:13fe2e65bc7bfed37372cc",
                  "android_client_info": {
                    "package_name": "com.example.adam_chat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUTfSCfP1LTSOMVj_2684Xpg_H__p_2jo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # Add permissions
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' $MANIFEST_FILE

          # Update compileSdk to 35
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle || true

          # Build APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
